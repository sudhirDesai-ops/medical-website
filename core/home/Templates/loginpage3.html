<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        /* .fo1{
            background-color: yellow;
            margin: 10px 10px 10px 10px;
            border-radius: 0px 0px 50px 50px;
            
        } */
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .login1 {
            border: 4px solid black;
            width: 300px;
            border-radius: 10px;

        }

        .hello {
            font-size: 28px;
            color: white;
        }

        .back {
            font-size: 20px;
            color: white;
        }

        .loginmain {
            background-color: #9e4ab5;

            border-radius: 85px 4px 85px 0px;
        }

        .account {
            font-size: 20px;
            text-align: center;
            margin-top: 12px;
        }

        .sub{
            background-color: #9e4ab5;
            height: 100%;
            width: 100%;
            padding: 5px;
            color: white;
            border: none;
            border-radius: 15px;
        }

        .sub:hover{
            background-color: transparent;
            border: 1px solid #9e4ab5;
            color: #9e4ab5;
            transition: 0.5s;
        }

        .input{
            border-radius: 15px;
        }

        .elab{
            font-weight: 600;
        }

        .e1{
            margin-top: 18px;
        }

        .create{
            color: #9e4ab5;
            display: flex;  
            justify-content: center;
            margin-bottom: 10px;
            margin-top: 5px;
        }
    </style>
</head>

<body>


    <div class="mainpart">
        <div class="login1">


            <div class="loginmain p-2">
                <h1 class="text-center hello">Secure Account</h1>
                <p class="text-center back"></p>
            </div>


            <form action="">

                <!-- <h1 class="account"><b></b></h1> -->


                <div class="p-2 mt-4 d-flex gap-1">

                    <div class="">
                         <label for="" class="form-label elab">Birthday</label>
                    <input type="email" class="form-control input" placeholder="Day">
                    </div>
                    <div class="">
                         <label for="" class="form-label elab e1"></label>
                    <input type="email" class="form-control input" placeholder="Month">
                    </div>
                    <div class="">
                         <label for="" class="form-label elab e1"></label>
                    <input type="email" class="form-control input" placeholder="Year">
                    </div>
                    

                </div>

                <div class="p-2">

                     <label for="" class="form-label elab">Password</label>
                    <input type="email" class="form-control input" placeholder="***********">

                </div>

                <div class="p-2">

                     <label for="" class="form-label elab">Phone Number</label>
                    <input type="email" class="form-control input" placeholder="+">

                </div>

                <div class="p-2">

                     <label for="" class="form-label elab">Security Question</label>
                    <input type="email" class="form-control input" placeholder="Example1234">
                    <input type="email" class="form-control input mt-2" placeholder="Your Answer...">

                </div>

                <div class="p-2">
                    <button class="sub">Create Account</button>
                </div>

                <a href="#" class="create text-decoration-none">Back To Login</a>
            </form>
        </div>
    </div>






    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
</body>

</html>
