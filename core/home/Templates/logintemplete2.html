<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>templet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #019577;

        }

        .input1 {
            background-color: transparent;
            width: auto;

        }

        .loginform {
            background-color: white;
            height: auto;
            width: 400px;
            max-width: 100%;
            padding: 20px;
            border-radius: 15px;
        }

        .loginbtn {
            background-color: #019577;
            color: white;
            padding: 5px;
            width: 100%;
            text-align: center;
            border-radius: 5px;
            display: block;
            border: none;
        }

        .loginbtn:hover {
            background-color: white;
            border: 1px solid #019577;
            transition: 0.5s;
            color: #019577;
        }

        .signup {
            color: #019577;
            font-weight: 600;
        }

        .log {
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }
    </style>
</head>

<body class="d-flex align-items-center justify-content-center" style="height: 100vh;">

    <div class="loginform d-flex align-items-center justify-content-center">

        <form action="" style="width: 100%;" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="d-flex align-items-center justify-content-center">
                <h1 class="log">Sign Up</h1>
            </div>

            <div class="form-floating mb-3 input1 mt-3">
                <input type="email" nama="username" class="form-control" placeholder="">
                <label for="" class="form-label">username</label>
            </div>


            <div class="form-floating mb-3 input1 w-100">
                <input type="password" nama="password" class="form-control" placeholder="">
                <label for="" class="form-label">Create a Password</label>
            </div>




            <div class="">
                <a href="#" class="text-decoration-none " style="color: #019577;">Forgot password</a>
            </div>

            <div class=" mt-3">
                <button type="submit" class="loginbtn text-decoration-none">Sign Up</button>
            </div>
            <p style="color: red;">{{error}}</p>
            <div class="mt-3">
                <p>Already have an account? <span class="signup"><a href="/signup/">Login</a></span></p>
            </div>


        </form>

    </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>

</body>

</html>
